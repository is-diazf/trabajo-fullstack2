spring.application.name=Micro-Usuario

spring.datasource.url=jdbc:mysql://localhost:3306/usuario?createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

spring.config.import=optional:classpath:application-local.properties

jwt.secreto=${JWT_SECRETO}
jwt.expiracion-minutos=60

admin.nombre=Administrador
admin.correo=${ADMIN_CORREO}
admin.contrasena=${ADMIN_CONTRASENA}
