<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Crear usuario - Veterinaria San Marcos</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg bg-success" style="border: 2px solid rgb(7, 7, 7);">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">
            <img src="mascotas/perroygato.png" alt="Logo" width="30" height="24">
          </a>
          <a class="navbar-brand" href="index.html" style="color: white;">Veterinaria<br>San Marcos</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Mostrar navegación">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link" href="index.html" style="color: white;">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="nosotros.html" style="color: white;">Nosotros</a></li>
              <li class="nav-item"><a class="nav-link" href="contenido.html" style="color: white;">Contenido y Novedades</a></li>
              <li class="nav-item"><a class="nav-link" href="https://wa.me/996144602" style="color: white;">Contáctanos</a></li>
            </ul>
          </div>
          <div class="ms-auto">
            <a id="boton-sesion" class="btn btn-light" href="login.html">Iniciar sesión</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="container mt-4 mb-5">
      <h1 class="text-center mb-4">Crear usuario</h1>
      <form id="formulario-registro" class="mx-auto" style="max-width: 550px;">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" maxlength="50" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="apellidos" class="form-label">Apellidos</label>
            <input type="text" class="form-control" id="apellidos" maxlength="100" required>
          </div>
        </div>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="correo" maxlength="100" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="contraseña" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="contraseña" minlength="8" maxlength="10" pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,10}" title="Use entre 8 y 10 caracteres, una mayúscula, un número y un símbolo especial" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="confirmar-contraseña" class="form-label">Confirmar contraseña</label>
            <input type="password" class="form-control" id="confirmar-contraseña" minlength="8" maxlength="10" required>
          </div>
        </div>
        <div class="mb-3">
          <label for="run" class="form-label">RUN</label>
          <input type="text" class="form-control" id="run" pattern="[0-9]{7,8}[0-9kK]" maxlength="9" title="Ingrese el RUN sin puntos ni guion, por ejemplo 123456785" required>
        </div>
        <div class="mb-3">
          <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
          <input type="date" class="form-control" id="fechaNacimiento" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="region" class="form-label">Región</label>
            <select class="form-select" id="region" required>
              <option value="" selected disabled>Seleccione una región</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label for="comuna" class="form-label">Comuna</label>
            <select class="form-select" id="comuna" required disabled>
              <option value="" selected disabled>Seleccione una comuna</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label for="direccion" class="form-label">Dirección</label>
          <input type="text" class="form-control" id="direccion" maxlength="300" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Crear cuenta</button>
        <p class="text-center mt-3 mb-0">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
      </form>
    </main>

    <footer class="bg-success text-white text-center p-3 mt-auto" style="border: 2px solid #030303;">

      </ul>

    </footer>

    <script src="sesion-header.js"></script>
    <script src="registro.js"></script>
</body>
</html>
