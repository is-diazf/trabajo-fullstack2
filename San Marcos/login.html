      <nav class="navbar navbar-expand-lg bg-success" style="border: 2px solid rgb(7, 7, 7);">

            <img src="mascotas/perroygato.png" alt="Logo" width="30" height="24">
          </a>
          <a class="navbar-brand" href="index.html" style="color: white;">Veterinaria<br>San Marcos</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html" style="color: white;">Inicio</a>

                <a class="nav-link" href="https://wa.me/996144602" style="color: white;">Contáctanos</a>

          <div class="ms-auto">
            <a class="btn btn-light disabled" href="login.html">Iniciar sesión</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="container mt-5">
        <h1 class="text-center mb-4">Iniciar Sesión</h1>
        <form class="mx-auto" style="max-width: 400px;">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="email" class="form-control" id="correo"  required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contraseña"  minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" title="Use al menos 8 caracteres, una mayúscula, un número y un símbolo especial" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Iniciar Sesión</button>
        </form>
    </main>
<br>
<br>
