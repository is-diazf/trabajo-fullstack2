<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Veterinaria San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        /* Tus estilos existentes se mantienen igual */
        body {
            background: linear-gradient(135deg, #0d4d2a, #1a7a3a);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .login-card .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-card .logo img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
        }
        .login-card .logo h3 {
            color: #0d4d2a;
            font-weight: 700;
            margin-top: 10px;
        }
        .login-card .btn-login {
            background: #0d4d2a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .login-card .btn-login:hover {
            background: #1a7a3a;
            transform: scale(1.02);
        }
        .login-card .form-control {
            border-radius: 30px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
        }
        .login-card .form-control:focus {
            border-color: #0d4d2a;
            box-shadow: 0 0 0 0.2rem rgba(13, 77, 42, 0.2);
        }
        .alert-error {
            display: none;
            border-radius: 30px;
            padding: 12px 20px;
            margin-bottom: 20px;
        }
        .alert-error.visible {
            display: block;
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .login-card .link-volver {
            color: #0d4d2a;
            text-decoration: none;
            font-weight: 500;
        }
        .login-card .link-volver:hover {
            text-decoration: underline;
        }
        .text-muted {
            color: #6c757d !important;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <img src="mascotas/perroygato.png" alt="Logo Veterinaria San Marcos">
            <h3>Veterinaria San Marcos</h3>
            <p class="text-muted">Panel de Administración</p>
        </div>

        <div id="alertError" class="alert alert-danger alert-error" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span id="errorMensaje">Credenciales incorrectas</span>
        </div>

        <form id="loginForm" onsubmit="return iniciarSesion(event)">
            <div class="mb-3">
                <label class="form-label fw-semibold">Correo electrónico</label>
                <input type="email" class="form-control" id="loginEmail" 
                       placeholder="admin@vet.com" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" class="form-control" id="loginPassword" 
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
            </button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">
                <i class="bi bi-info-circle me-1"></i>
                Usuario: admin@vet.com / Contraseña: admin123
            </small>
        </div>

        <div class="text-center mt-3">
            <a href="index.html" class="link-volver">
                <i class="bi bi-arrow-left me-1"></i> Volver al sitio
            </a>
        </div>
    </div>

    <script>
        function iniciarSesion(event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btnLogin = document.getElementById('btnLogin');
            const alertError = document.getElementById('alertError');
            const errorMensaje = document.getElementById('errorMensaje');

            // Ocultar error previo
            alertError.classList.remove('visible');

            // Deshabilitar botón
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verificando...';

            // Simular validación
            setTimeout(() => {
                // Obtener usuarios desde localStorage
                const usuarios = JSON.parse(localStorage.getItem('usuariosAdmin') || '[]');

                // Buscar usuario con rol admin
                const usuario = usuarios.find(u => 
                    u.email === email && u.password === password && u.rol === 'admin'
                );

                if (usuario) {
                    // Guardar sesión
                    localStorage.setItem('adminSesion', JSON.stringify({
                        id: usuario.id,
                        nombre: usuario.nombre,
                        email: usuario.email,
                        rol: usuario.rol
                    }));

                    // Redirigir al panel
                    window.location.href = 'admin.html';
                } else {
                    // Mostrar error
                    errorMensaje.textContent = 'Credenciales incorrectas. Verifica tu email y contraseña.';
                    alertError.classList.add('visible');

                    // Restaurar botón
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión';
                }
            }, 800);
        }

        // Si ya hay sesión activa, redirigir automáticamente
        document.addEventListener('DOMContentLoaded', function() {
            const sesion = JSON.parse(localStorage.getItem('adminSesion') || 'null');
            if (sesion && sesion.rol === 'admin') {
                window.location.href = 'admin.html';
            }
        });
    </script>

</body>
</html>
