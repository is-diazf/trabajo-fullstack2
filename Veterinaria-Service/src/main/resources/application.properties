server.port=8084

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/veterinaria?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mismo secreto que Micro-Usuario: este servicio valida los JWT que emite ese servicio.
jwt.secreto=${JWT_SECRETO}
