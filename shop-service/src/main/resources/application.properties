server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

shop.admin.username=${SHOP_ADMIN_USERNAME}
shop.admin.password=${SHOP_ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
